
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  archive:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Archive unsigned iOS app
        run: |
          xcodebuild \
            -project "ContraRedirectTest.xcodeproj" \
            -scheme "ContraRedirectTest" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MyApp.xcarchive" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/MyApp.xcarchive/Products/Applications"
          APP="$(find "$APP_PATH" -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [[ -z "$APP" ]]; then
            echo "Archived .app not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry \
            "$GITHUB_WORKSPACE/ContraRedirectTest-unsigned.ipa" \
            Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ContraRedirectTest-unsigned-IPA
          path: ContraRedirectTest-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
